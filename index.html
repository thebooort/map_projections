```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>View Image</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      color: white;
    }

    img {
      width: min(90vw, 700px);
      height: auto;
      border-radius: 10px;
      cursor: zoom-in;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      transition: transform .2s;
    }

    img:hover {
      transform: scale(1.02);
    }

    p {
      opacity: .7;
    }
  </style>
</head>

<body>

  <div class="container">

    <a href="map_projections.png" target="_blank">
      <img
        src="small.jpg"
        alt="High-resolution image"
      >
    </a>

    <p>Click the image to view it in full resolution</p>

  </div>

</body>
</html>
```
